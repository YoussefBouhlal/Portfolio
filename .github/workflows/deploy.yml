name: Validate and Deploy Portfolio

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint source
        run: |
          npm run lint:js
          npm run lint:css
          npm run lint:json
          git diff --check
      - name: Build production assets
        run: npm run build -- --output-path="$RUNNER_TEMP/portfolio-build"
      - name: Stage static site
        run: |
          mkdir -p _site/build _site/img/projects
          cp index.html _site/
          find "$RUNNER_TEMP/portfolio-build" -maxdepth 1 -type f \( -name '*.js' -o -name '*.css' -o -name '*.LICENSE.txt' \) -exec cp {} _site/build/ \;
          cp img/about.webp img/favicon.svg img/favicon.ico img/og-image.png _site/img/
          cp img/projects/youbou-code-block-plugin.webp img/projects/webpify-plugin.webp img/projects/youbou-blocks-theme.webp img/projects/react-store.webp _site/img/projects/
          cp LICENSE ASSET-LICENSES.md _site/
          test -s _site/build/main.js
          test -s _site/build/main.css
          grep -q 'Copyright' _site/build/main.js
          grep -q 'gsap.com' _site/build/main.js
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLICATION_APPROVED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e